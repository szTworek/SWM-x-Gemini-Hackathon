<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Panel Asystenta</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; background: #fff; }
        .controls { padding: 12px; background: #f1f3f4; border-bottom: 1px solid #dadce0; display: flex; gap: 8px; justify-content: space-between; }
        button { padding: 8px 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: 500; color: white; transition: 0.2s; font-size: 13px; flex: 1;}
        #add-bot-btn { background-color: #1a73e8; }
        #add-bot-btn:disabled { background-color: #8ab4f8; cursor: wait; }
        #toggle-gemini-btn { background-color: #5f6368; }
        #toggle-gemini-btn.active { background-color: #1e8e3e; }

        #chat-container { flex-grow: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background: #fafbfc; }
        .message { padding: 10px 14px; border-radius: 8px; border: 1px solid #e8eaed; font-size: 14px; background: #fff; line-height: 1.4; }
        .message strong { color: #1a73e8; margin-right: 4px; }
        .partial-message { opacity: 0.6; border-style: dashed; background: #f8f9fa; }
        .system-message { color: #5f6368; font-size: 0.85em; text-align: center; margin: 8px 0; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 3px; }
    </style>
</head>
<body>
    <div class="controls">
        <button id="add-bot-btn">Dodaj Bota</button>
        <button id="toggle-gemini-btn">Włącz Gemini</button>
    </div>
    <div id="chat-container"></div>
    <script src="panel.js"></script>
</body>
</html>
