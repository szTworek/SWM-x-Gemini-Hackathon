version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: swm-gemini-hackathon-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /app/.venv
    env_file:
      - ./backend/.env
    restart: unless-stopped
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload